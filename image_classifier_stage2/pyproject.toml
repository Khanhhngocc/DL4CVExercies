[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-sad-image-classifier"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tensorflow",
    "opencv-python",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
